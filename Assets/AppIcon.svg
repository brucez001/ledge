<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Ledge app icon: a frosted blue ledge on graphite.

    A translucent slide-over panel is parked against the screen edge, resting
    on an L-shaped ledge with an icy blue tint and a restrained edge glow,
    echoing the app's neutral, frosted surfaces. The ledge docks to the
    leading edge, matching the app's default dock side and its menu-bar
    symbol, and anchoring the composition's visual weight. Rendered with
    gradients and geometry only; the rasteriser (sips) does not support SVG
    filters.
  -->
  <defs>
    <linearGradient id="graphite" x1="694" y1="100" x2="324" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#373C44"/>
      <stop offset="1" stop-color="#1B1C20"/>
    </linearGradient>
    <linearGradient id="silver" x1="212" y1="210" x2="774" y2="790" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D4E9FF"/>
      <stop offset="1" stop-color="#79B2EB"/>
    </linearGradient>
    <linearGradient id="glass" x1="512" y1="218" x2="512" y2="712" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D0E6FF" stop-opacity=".15"/>
      <stop offset="1" stop-color="#D0E6FF" stop-opacity=".05"/>
    </linearGradient>
  </defs>

  <!-- 824 pt tile on the standard macOS icon grid -->
  <path d="M285 100C174 100 100 174 100 285V739C100 850 174 924 285 924H739C850 924 924 850 924 739V285C924 174 850 100 739 100H285Z" fill="url(#graphite)"/>

  <!-- The slide-over panel: macOS glass material, parked on the ledge -->
  <rect x="212" y="218" width="344" height="494" rx="40" fill="url(#glass)"/>
  <rect x="213.5" y="219.5" width="341" height="491" rx="38.5" fill="none" stroke="#D0E6FF" stroke-opacity=".20" stroke-width="3"/>

  <!-- Subtle cool edge glow: stacked strokes approximate a light falloff -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M212 236V664C212 717 255 760 308 760H800" stroke="#A8CFFF" stroke-opacity=".015" stroke-width="200"/>
    <path d="M212 236V664C212 717 255 760 308 760H800" stroke="#A8CFFF" stroke-opacity=".025" stroke-width="164"/>
    <path d="M212 236V664C212 717 255 760 308 760H800" stroke="#A8CFFF" stroke-opacity=".045" stroke-width="130"/>
    <path d="M212 236V664C212 717 255 760 308 760H800" stroke="url(#silver)" stroke-width="96"/>
  </g>
</svg>
