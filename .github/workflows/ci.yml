name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Swift toolchain
        run: swift --version

      - name: Install the Metal toolchain
        # SwiftTerm ships a Metal shader, and Xcode 26 and later install the
        # compiler for it as a separate component.
        run: xcrun metal -v >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Build
        run: swift build

      - name: Test
        run: swift test
